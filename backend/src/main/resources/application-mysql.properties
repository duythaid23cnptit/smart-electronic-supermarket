# MySQL is opt-in: start the application with the mysql profile explicitly.
# Credentials must come from the environment and have no source-controlled defaults.
spring.datasource.url=${SASMS_MYSQL_URL:jdbc:mysql://127.0.0.1:3306/sasms_tv4_demo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SASMS_MYSQL_USERNAME}
spring.datasource.password=${SASMS_MYSQL_PASSWORD}
server.port=${SASMS_MYSQL_SERVER_PORT:8082}

# The schema is created by db/mysql/schema.sql. Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.h2.console.enabled=false

# W5/W6 demo prices remain configuration assumptions, not approved economics.
sasms.pos.demo-prices.TV-55-DEMO=${SASMS_PRICE_TV_55_DEMO:15000000}
sasms.pos.demo-prices.PHONE-DEMO=${SASMS_PRICE_PHONE_DEMO:5000000}
